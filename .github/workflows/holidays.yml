name: 祝日のデータを更新

on:
  schedule:
    # 毎月1日 0:00 UTC（日本時間 9:00）
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 内閣府の CSV を取得して UTF-8 にする
        run: |
          curl -sSfL -o /tmp/sjis.csv https://www8.cao.go.jp/chosei/shukujitsu/syukujitsu.csv
          iconv -f CP932 -t UTF-8 /tmp/sjis.csv > /tmp/utf8.csv
          # 取得に失敗して中身が空・壊れているときは上書きしない
          grep -q '^[0-9]\{4\}/[0-9]\{1,2\}/[0-9]\{1,2\},' /tmp/utf8.csv
          cp /tmp/utf8.csv holidays/syukujitsu.csv
      - name: 変わっていればコミット
        run: |
          if git diff --quiet; then echo "変更なし"; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898299+github-actions[bot]@users.noreply.github.com'
          git add holidays/syukujitsu.csv
          git commit -m '祝日のデータを更新'
          git push
